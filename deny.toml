[advisories]
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "Extraction flaws in zip 2, a build-dependency of sherpa-onnx-sys that only unpacks sherpa-onnx release archives at build time; the app never extracts archives. Remove once sherpa-onnx-sys moves to zip >= 9." },
  { id = "RUSTSEC-2026-0368", reason = "Extraction flaws in zip 2, a build-dependency of sherpa-onnx-sys that only unpacks sherpa-onnx release archives at build time; the app never extracts archives. Remove once sherpa-onnx-sys moves to zip >= 9." },
  { id = "RUSTSEC-2026-0369", reason = "Extraction flaws in zip 2, a build-dependency of sherpa-onnx-sys that only unpacks sherpa-onnx release archives at build time; the app never extracts archives. Remove once sherpa-onnx-sys moves to zip >= 9." },
]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are unpublished and depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
