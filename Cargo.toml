[workspace]
members = ["crates/*"]

[workspace.package]
authors = ["Bruno Paz <[EMAIL_REDACTED]>"]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
verbatim-audio = { path = "crates/audio" }
verbatim-core = { path = "crates/core" }
verbatim-models = { path = "crates/models" }
verbatim-transcribe = { path = "crates/transcribe" }
async-channel = "2.5.0"
gst = { version = "0.25.4", package = "gstreamer" }
gst-app = { version = "0.25.2", package = "gstreamer-app" }
sha2 = "0.11.1"
sherpa-onnx = "1.13.8"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[package]
name = "verbatim"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
async-channel.workspace = true
verbatim-audio.workspace = true
verbatim-core.workspace = true
verbatim-models.workspace = true
verbatim-transcribe.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
