name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Install system dependencies
        run: dnf install -y git curl meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel blueprint-compiler glib2-devel gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-base gstreamer1-plugins-good gettext desktop-file-utils appstream

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all -- -D warnings

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check Flatpak Cargo sources are up to date
        run: |
          # The container user does not own the checkout, which git refuses.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build-aux/update-cargo-sources.sh
          git diff --exit-code -- build-aux/cargo-sources.json || {
            echo "::error file=build-aux/cargo-sources.json::Out of date with Cargo.lock. Run 'task flatpak:cargo-sources' and commit the result."
            exit 1
          }

  test:
    name: Test
    runs-on: ubuntu-26.04
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      # desktop-file-utils and appstream are what let meson's registered
      # validate-desktop/validate-appdata tests actually run instead of
      # silently no-op'ing (see data/meson.build's `required: false` finds).
      - name: Install system dependencies
        run: dnf install -y git curl meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel blueprint-compiler glib2-devel gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-base gstreamer1-plugins-good gettext desktop-file-utils appstream

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Build
        run: meson compile -C _build

      - name: Test
        run: meson test -C _build --print-errorlogs

  flatpak-dev:
    name: Build Flatpak (Development)
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04
    needs: [lint, test]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare build
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          version="main-${short_sha}"
          echo -n "${version}" > VERSION

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: dev.brunopaz.Verbatim.Devel.flatpak
          manifest-path: build-aux/dev.brunopaz.Verbatim.Devel.json
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: dev.brunopaz.Verbatim.Devel.flatpak
          path: dev.brunopaz.Verbatim.Devel.flatpak

  flatpak-release:
    name: Build Flatpak (Release)
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    needs: [lint, test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          echo -n "${version#v}" > VERSION
          python3 build-aux/add-release.py "${version}"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: dev.brunopaz.Verbatim.flatpak
          manifest-path: build-aux/dev.brunopaz.Verbatim.json
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dev.brunopaz.Verbatim.flatpak

      - name: Upload Flatpak artifact to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dev.brunopaz.Verbatim.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build .deb package
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates meson ninja-build gcc g++ pkg-config libgtk-4-dev libadwaita-1-dev blueprint-compiler libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gettext desktop-file-utils appstream

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo -n "${RELEASE_TAG#v}" > VERSION

      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .deb
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager deb --target verbatim.deb

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verbatim.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verbatim-deb
          path: verbatim.deb

  build-rpm:
    name: Build .rpm package
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          dnf install -y meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel blueprint-compiler glib2-devel gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-base gstreamer1-plugins-good gettext desktop-file-utils appstream curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo -n "${RELEASE_TAG#v}" > VERSION

      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .rpm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager rpm --target verbatim.rpm

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verbatim.rpm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verbatim-rpm
          path: verbatim.rpm

  native-packages-release:
    name: Attach .deb/.rpm packages to release
    needs: [build-deb, build-rpm]
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verbatim-deb

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verbatim-rpm

      - name: Upload packages to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            verbatim.deb
            verbatim.rpm
          token: ${{ secrets.GITHUB_TOKEN }}
