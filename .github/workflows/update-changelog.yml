name: "Update Changelog"
on:
  release:
    types: [published]
jobs:
  update:
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Set version
        shell: bash
        run: |
            version="${{ github.event.release.tag_name }}"
            echo -n "${version#v}" > VERSION
            python3 build-aux/add-release.py "${version}"

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1.12.0
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          branch: ${{ github.event.release.target_commitish }}
          commit_message: "chore(release): [skip-ci] ${{ github.event.release.tag_name }}"
          file_pattern: CHANGELOG.md VERSION data/dev.brunopaz.Verbatim.metainfo.xml.in.in
