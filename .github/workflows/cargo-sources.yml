name: Update Flatpak Cargo Sources
# Renovate updates Cargo.lock but cannot run the generator, so its branches
# get build-aux/cargo-sources.json regenerated here.
on:
  push:
    branches: ["renovate/**"]
    paths: [Cargo.lock]

jobs:
  update:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Regenerate from Cargo.lock
        run: build-aux/update-cargo-sources.sh

      - name: Commit
        id: commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "build(deps): update Flatpak Cargo sources"
          file_pattern: build-aux/cargo-sources.json

      # A push made with GITHUB_TOKEN starts no workflows, so CI is started
      # for the new commit explicitly.
      - name: Run CI on the new commit
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
